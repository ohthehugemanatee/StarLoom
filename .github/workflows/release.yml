name: Release Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  build:
    # Tag pushes reuse the commit already tested on main; skip duplicate runs.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Build
        run: make build

      - name: Unit tests
        env:
          CGO_ENABLED: '1'
        run: make test

      - name: Lint
        env:
          CGO_ENABLED: '1'
        run: make lint

      - name: Integration tests
        env:
          CGO_ENABLED: '1'
        run: make integration-test

  publish-image:
    needs: [build]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
            buf_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
            buf_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.50.0/buf-Linux-${{ matrix.buf_arch }}" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Build release inputs
        run: make protocol frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.suffix }}
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=starloom-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=starloom-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}

  publish-manifest:
    needs: [publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-arch manifest tags
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
